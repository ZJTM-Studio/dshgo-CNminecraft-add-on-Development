<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 760" width="1180" height="760">
  <defs>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="topbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0F2356"/>
      <stop offset="100%" stop-color="#1B3F8F"/>
    </linearGradient>
  </defs>

  <!-- 窗口外框 -->
  <rect x="0" y="0" width="1180" height="760" rx="16" fill="url(#win)"/>
  <rect x="0.5" y="0.5" width="1179" height="759" rx="16" fill="none" stroke="#30363D" stroke-width="1"/>

  <!-- 标题栏 -->
  <path d="M0 16 A16 16 0 0 1 16 0 H1164 A16 16 0 0 1 1180 16 V52 H0 Z" fill="url(#topbar)"/>
  <circle cx="26" cy="26" r="6" fill="#FF5F57"/>
  <circle cx="48" cy="26" r="6" fill="#FEBC2E"/>
  <circle cx="70" cy="26" r="6" fill="#28C840"/>
  <text x="590" y="32" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans SC',sans-serif"
        font-size="13" font-weight="600" fill="#C3D3F0" letter-spacing="0.5">筑界工坊 · 网易MC开发</text>

  <g font-family="'SF Mono','JetBrains Mono','Cascadia Code',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace" font-size="15">
    <!-- 用户 -->
    <text x="40" y="100" fill="#7EC8E3" font-weight="600">你 ›</text>
    <text x="90" y="100" fill="#E6EDF3">做一个自定义方块，右键放光</text>

    <!-- Agent 开始 -->
    <text x="40" y="146" fill="#F0B429" font-weight="600">筑界工坊 ›</text>
    <text x="170" y="146" fill="#8B949E">查文档…</text>

    <!-- 检索过程 -->
    <text x="60" y="182" fill="#3FB950">$</text>
    <text x="76" y="182" fill="#A5B4CC">grep -rn "RegisterBlockPalette" mcdocs/1-ModAPI/接口/方块/</text>
    <text x="60" y="210" fill="#56D364">✓</text>
    <text x="76" y="210" fill="#7B8CA6">3 处命中</text>

    <text x="60" y="242" fill="#3FB950">$</text>
    <text x="76" y="242" fill="#A5B4CC">grep -rn "自定义方块" mcguide/</text>
    <text x="60" y="270" fill="#56D364">✓</text>
    <text x="76" y="270" fill="#7B8CA6">12 处命中</text>

    <!-- 文件树 -->
    <text x="60" y="312" fill="#8B949E">输出：</text>
    <text x="76" y="342" fill="#58A6FF">behavior_pack/</text>
    <text x="76" y="370" fill="#79C0FF">├── manifest.json</text>
    <text x="76" y="398" fill="#79C0FF">├── netease_blocks/glow_block.json</text>
    <text x="76" y="426" fill="#79C0FF">└── netease_scripts/modMain.py</text>
    <text x="76" y="454" fill="#7B8CA6" font-size="13">（3 个文件的完整内容已给出）</text>

    <!-- 分隔 -->
    <line x1="60" y1="486" x2="840" y2="486" stroke="#30363D" stroke-width="1"/>

    <!-- 收尾三问 -->
    <text x="60" y="518" fill="#F0B429" font-weight="600">收尾三问</text>
    <text x="60" y="550" fill="#56D364">✓</text>
    <text x="76" y="550" fill="#C9D1D9">能导入 MCStudio</text>
    <text x="330" y="550" fill="#7B8CA6">行为包 + 资源包已配对</text>

    <text x="60" y="580" fill="#56D364">✓</text>
    <text x="76" y="580" fill="#C9D1D9">uuid 全唯一</text>
    <text x="330" y="580" fill="#7B8CA6">3 个 uuid 互不重复</text>

    <text x="60" y="610" fill="#56D364">✓</text>
    <text x="76" y="610" fill="#C9D1D9">路径大小写</text>
    <text x="330" y="610" fill="#7B8CA6">与 netease_blocks 定义一致</text>

    <!-- 光标 -->
    <rect x="76" y="646" width="9" height="18" fill="#58A6FF" opacity="0.85"/>
  </g>

  <!-- 右下角水印 -->
  <text x="1140" y="726" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,sans-serif"
        font-size="12" fill="#30363D" letter-spacing="0.5">筑界同盟工作室</text>
</svg>
