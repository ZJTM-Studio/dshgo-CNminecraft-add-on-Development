<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1B2A"/>
      <stop offset="55%" stop-color="#12303F"/>
      <stop offset="100%" stop-color="#1B9AAA"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57CC99"/>
      <stop offset="100%" stop-color="#F4A261"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>

  <!-- 左侧像素方块群 -->
  <g opacity="0.9">
    <rect x="70" y="196" width="44" height="44" rx="4" fill="#57CC99" opacity="0.85"/>
    <rect x="70" y="196" width="44" height="14" rx="4" fill="#7FE0B3"/>
    <rect x="118" y="222" width="34" height="34" rx="3" fill="#1B9AAA" opacity="0.9"/>
    <rect x="156" y="188" width="28" height="28" rx="3" fill="#F4A261" opacity="0.85"/>
    <rect x="96" y="160" width="24" height="24" rx="2" fill="#7FE0B3" opacity="0.55"/>
    <rect x="140" y="152" width="18" height="18" rx="2" fill="#1B9AAA" opacity="0.45"/>
    <rect x="46" y="238" width="20" height="20" rx="2" fill="#57CC99" opacity="0.45"/>
  </g>

  <!-- 右侧装饰 -->
  <g opacity="0.5">
    <circle cx="1150" cy="80" r="90" fill="none" stroke="#57CC99" stroke-opacity="0.28" stroke-width="1.5"/>
    <circle cx="1150" cy="80" r="56" fill="none" stroke="#F4A261" stroke-opacity="0.22" stroke-width="1.5"/>
    <circle cx="1150" cy="80" r="24" fill="#57CC99" opacity="0.12"/>
  </g>
  <g stroke="#57CC99" stroke-opacity="0.25" stroke-width="1.5" fill="none">
    <path d="M980 250 H1080 L1110 280 H1210"/>
    <path d="M980 250 V200 L1010 170 H1100"/>
  </g>

  <!-- 主标题 -->
  <text x="72" y="112" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif"
        font-size="52" font-weight="700" fill="#FFFFFF" letter-spacing="2">筑界工坊</text>
  <text x="72" y="148" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif"
        font-size="20" font-weight="400" fill="#8FD8E0" letter-spacing="6">ZHUJIE STUDIO</text>

  <rect x="72" y="164" width="180" height="3" rx="1.5" fill="url(#accent)"/>

  <!-- 副标题 -->
  <text x="72" y="290" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif"
        font-size="22" font-weight="500" fill="#C7E9EC">网易《我的世界》中国版 · Agent 预设</text>
  <text x="72" y="316" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif"
        font-size="15" font-weight="400" fill="#6FA8B5" opacity="0.9">ModSDK · MCStudio · 直接产出可导入的完整模组包</text>

  <!-- 右上角标签 -->
  <g>
    <rect x="1010" y="46" width="120" height="30" rx="15" fill="#57CC99" fill-opacity="0.14" stroke="#57CC99" stroke-opacity="0.5"/>
    <text x="1070" y="66" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="13" fill="#8FE8C0" letter-spacing="0.5">DSH Bundle</text>
  </g>
</svg>
