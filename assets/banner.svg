<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A1B45"/>
      <stop offset="60%" stop-color="#122C6E"/>
      <stop offset="100%" stop-color="#1B3F8F"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#A9C4F5"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#4A7BE8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4A7BE8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <circle cx="230" cy="160" r="170" fill="url(#glow)"/>

  <!-- 重绘 logo：楼体 + 环 + 底座（白色线条） -->
  <g transform="translate(150 46) scale(1.02)" fill="none" stroke="url(#line)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <!-- 楼体轮廓 -->
    <path d="M92 178 V72 L118 54 V178"/>
    <path d="M118 178 V74 L142 92 V178"/>
    <path d="M142 178 V92 L166 74 V178"/>
    <path d="M62 178 V108 L92 88"/>
    <path d="M166 178 V108 L190 126 V178"/>
    <!-- 环 -->
    <ellipse cx="126" cy="196" rx="96" ry="26" stroke-width="8"/>
    <!-- 底座 -->
    <path d="M30 248 H60 V228"/>
    <path d="M78 248 V228"/>
    <path d="M100 248 V228"/>
    <path d="M126 248 V228"/>
    <path d="M152 248 V228"/>
    <path d="M192 248 H222 V228"/>
  </g>

  <!-- 分隔 -->
  <line x1="392" y1="96" x2="392" y2="224" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.5"/>

  <!-- 文字 -->
  <text x="440" y="140" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif"
        font-size="56" font-weight="700" fill="#FFFFFF" letter-spacing="4">筑界工坊</text>
  <text x="442" y="176" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="17" font-weight="500" fill="#9DBBF0" letter-spacing="7">ZHUJIE STUDIO</text>

  <rect x="442" y="196" width="128" height="3" rx="1.5" fill="#F0B429"/>

  <text x="440" y="244" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif"
        font-size="21" font-weight="500" fill="#D6E3FA">网易《我的世界》中国版 · Agent 预设</text>
  <text x="440" y="272" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans SC',sans-serif"
        font-size="14" font-weight="400" fill="#7E9BD0">ModSDK · MCStudio · 直接产出可导入的完整模组包</text>

  <!-- 右上角标签 -->
  <g>
    <rect x="1046" y="42" width="150" height="32" rx="16" fill="#F0B429" fill-opacity="0.16" stroke="#F0B429" stroke-opacity="0.55"/>
    <text x="1121" y="63" text-anchor="middle" font-family="-apple-system,sans-serif"
          font-size="13" font-weight="600" fill="#F5CC66" letter-spacing="0.6">DSH Bundle</text>
  </g>
</svg>
